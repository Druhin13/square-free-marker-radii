name: Independent full named positive marker-rule verification (private)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/named-positive-rules.yml
      - tools/verify_named_positive_rules.c
      - tools/run_named_positive_audit.py
      - artifacts/exact-symmetry-addendum-manifest.json
      - proofs/m3/exact-symmetry/*_selected_contexts.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exhaustive-named-positive-rules:
    name: No symmetry pruning - ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        case: [s4, a4, s3, v4i]
    steps:
      - name: Checkout private original model sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Independently expand and verify all named square-free words
        run: |
          python3 -B tools/run_named_positive_audit.py \
            --case "${{ matrix.case }}" \
            --report "named-positive-${{ matrix.case }}.json"
      - name: Archive independent named-source census and negative controls
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: named-positive-${{ matrix.case }}
          path: named-positive-${{ matrix.case }}.json
          if-no-files-found: error
          retention-days: 14
